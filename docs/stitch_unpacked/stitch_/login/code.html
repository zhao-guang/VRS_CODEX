<!-- Username / Email -->
<div>
<label class="block font-label-mono text-label-mono text-on-surface-variant mb-2" for="email">账号/邮箱</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="person">person</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-base text-body-base" id="email" name="email" placeholder="输入您的账号或邮箱" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-mono text-label-mono text-on-surface-variant mb-2" for="password">密码</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow font-body-base text-body-base" id="password" name="password" placeholder="输入密码" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>

<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded-DEFAULT" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                                记住账号
                            </label>
</div>
