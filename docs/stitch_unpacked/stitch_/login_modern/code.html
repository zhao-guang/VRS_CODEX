<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GNSS 管理与解算系统 - 登录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-text": "#0a2e25",
                        "secondary-text": "#4a6b63",
                        "brand-accent": "#008080",
                    },
                    fontFamily: {
                        "headline-xl": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-base": ["Inter"],
                        "label-mono": ["Space Grotesk"],
                        "headline-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-xl": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-base": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-mono": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-body-base antialiased bg-gradient-to-br from-[#caeae6] via-[#dce8f4] to-[#ded6ef] relative overflow-hidden">
<!-- Abstract blurred background shapes for organic feel -->
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-[#b2dfdb] opacity-60 mix-blend-multiply blur-[80px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-[#c5cae9] opacity-60 mix-blend-multiply blur-[100px]"></div>
<div class="absolute top-[20%] right-[10%] w-[400px] h-[400px] rounded-full bg-[#e1bee7] opacity-40 mix-blend-multiply blur-[80px]"></div>
<!-- Centered Glassmorphism Card -->
<div class="relative z-10 w-full max-w-lg mx-6 p-10 sm:p-12 bg-white/40 backdrop-blur-xl border border-white/60 rounded-[32px] shadow-[0_8px_32px_0_rgba(31,38,135,0.07)]">
<!-- Branding -->
<div class="flex flex-col items-center mb-10 text-center">
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-4xl text-brand-accent" data-icon="satellite_alt">satellite_alt</span>
<span class="font-headline-md text-primary-text tracking-tight">GNSS Precision</span>
</div>
<h1 class="font-headline-xl text-primary-text mb-2">欢迎登录</h1>
<p class="font-body-base text-secondary-text">请使用您的专业账号访问系统</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<div class="space-y-5">
<!-- Username / Email -->
<div>
<label class="block font-label-mono text-secondary-text mb-2 ml-1" for="email">账号/邮箱</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary-text/70" data-icon="person">person</span>
</div>
<input autocomplete="email" class="block w-full pl-12 pr-4 py-3.5 border-none rounded-[16px] bg-white text-primary-text shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] placeholder-secondary-text/50 focus:outline-none focus:ring-2 focus:ring-brand-accent/50 transition-all font-body-base" id="email" name="email" placeholder="输入您的账号或邮箱" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-mono text-secondary-text mb-2 ml-1" for="password">密码</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary-text/70" data-icon="lock">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-12 pr-12 py-3.5 border-none rounded-[16px] bg-white text-primary-text shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] placeholder-secondary-text/50 focus:outline-none focus:ring-2 focus:ring-brand-accent/50 transition-all font-body-base" id="password" name="password" placeholder="输入密码" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary-text/70 hover:text-primary-text focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 text-brand-accent focus:ring-brand-accent border-none bg-white shadow-[inset_0_1px_2px_rgba(0,0,0,0.1)] rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-secondary-text" for="remember-me">
                        记住账号
                    </label>
</div>
<div class="text-sm">
<a class="font-body-sm font-medium text-brand-accent hover:text-primary-text transition-colors" href="#">
                        忘记密码？
                    </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="group relative w-full flex justify-center py-4 px-4 font-body-base font-medium rounded-[16px] text-white bg-gradient-to-r from-[#179a97] to-[#0c6b6d] hover:from-[#138885] hover:to-[#095759] shadow-[0_4px_14px_rgba(12,107,109,0.3)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#179a97] focus:ring-offset-[#e2eafc] transition-all" type="submit">
                    立即登录
                </button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-10 pt-6 border-t border-white/40 flex justify-center space-x-8">
<a class="font-body-sm text-secondary-text hover:text-brand-accent transition-colors flex items-center gap-1.5" href="#">
<span class="material-symbols-outlined text-sm" data-icon="person_add">person_add</span>
                请求账号访问
            </a>
<a class="font-body-sm text-secondary-text hover:text-brand-accent transition-colors flex items-center gap-1.5" href="#">
<span class="material-symbols-outlined text-sm" data-icon="help">help</span>
                帮助中心
            </a>
</div>
</div>
</body></html>
